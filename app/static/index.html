<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adaptive AI Study Coach</title>
<style>
    body {
        font-family: Arial, sans-serif;
        max-width: 760px;
        margin: 40px auto;
        padding: 0 20px;
        background: #f6f7fb;
        color: #222;
    }

    h1 {
        margin-bottom: 5px;
    }

    h2 {
        margin-top: 30px;
    }

    form > div,
    #report,
    #practice {
        background: white;
        padding: 20px;
        margin: 18px 0;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    label {
        display: block;
        padding: 6px 0;
        cursor: pointer;
    }

    button {
        padding: 10px 18px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 15px;
        background: #222;
        color: white;
    }

    button:hover {
        opacity: 0.85;
    }

    #practice-feedback {
        font-weight: bold;
        margin-top: 15px;
    }
</style>
</head>
<body>
    <h1>Adaptive AI Study Coach</h1>
    <p>FAST-NUCES Math Practice</p>

    <h2>Diagnostic</h2>

    <form id="diagnostic-form">
        <div>
            <p>1. Which property states that adding two real numbers always gives another real number?</p>
            <label><input type="radio" name="num_001" value="Closure property"> Closure property</label><br>
            <label><input type="radio" name="num_001" value="Commutative property"> Commutative property</label><br>
            <label><input type="radio" name="num_001" value="Associative property"> Associative property</label><br>
            <label><input type="radio" name="num_001" value="Distributive property"> Distributive property</label>
        </div>

        <div>
            <p>2. What are the roots of x² - 7x + 12 = 0?</p>
            <label><input type="radio" name="alg_001" value="2 and 6"> 2 and 6</label><br>
            <label><input type="radio" name="alg_001" value="3 and 4"> 3 and 4</label><br>
            <label><input type="radio" name="alg_001" value="-3 and -4"> -3 and -4</label><br>
            <label><input type="radio" name="alg_001" value="1 and 12"> 1 and 12</label>
        </div>

        <div>
            <p>3. If tan θ = 1 and θ is acute, what is θ?</p>
            <label><input type="radio" name="trig_001" value="30°"> 30°</label><br>
            <label><input type="radio" name="trig_001" value="45°"> 45°</label><br>
            <label><input type="radio" name="trig_001" value="60°"> 60°</label><br>
            <label><input type="radio" name="trig_001" value="90°"> 90°</label>
        </div>

        <br>
        <button type="submit">Submit Diagnostic</button>
    </form>

    <div id="report"></div>
<div id="practice"></div>

<script>
    const form = document.getElementById("diagnostic-form");
    const reportBox = document.getElementById("report");
    const practiceBox = document.getElementById("practice");

    let agentState = null;

    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const questionIds = ["num_001", "alg_001", "trig_001"];

        const answers = questionIds.map((id) => {
            const selected = document.querySelector(
                `input[name="${id}"]:checked`
            );

            return {
                question_id: id,
                selected_answer: selected ? selected.value : null
            };
        });

        const diagnosticResponse = await fetch("/diagnostic/submit", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ answers })
        });

        const diagnosticData = await diagnosticResponse.json();

        const agentResponse = await fetch("/agent/start", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                diagnostic_results: diagnosticData.results,
                weak_topics: [],
                current_topic: null,
                attempts_on_topic: 0,
                status: "diagnosing"
            })
        });

        const agentData = await agentResponse.json();

        agentState = agentData.state;

        if (agentState.status === "complete") {
            reportBox.innerHTML = `
                <h2>Diagnostic Report</h2>
                <p>No weak topics detected.</p>
            `;
            practiceBox.innerHTML = "";
            return;
        }

        reportBox.innerHTML = `
            <h2>Diagnostic Report</h2>
            <p><strong>Weak topics:</strong> ${agentState.weak_topics.join(", ")}</p>
            <p><strong>Current focus:</strong> ${agentState.current_topic}</p>
        `;

        showPracticeQuestion(agentData.practice_question);
    });


    function showPracticeQuestion(question) {
        if (!question) {
            practiceBox.innerHTML = "<p>No practice question available.</p>";
            return;
        }

        const optionsHtml = question.options.map((option) => `
            <label>
                <input type="radio" name="practice_answer" value="${option}">
                ${option}
            </label><br>
        `).join("");

        practiceBox.innerHTML = `
            <h2>Targeted Practice</h2>
            <p>${question.question}</p>

            ${optionsHtml}

            <br>
            <button id="submit-practice">Submit Practice Answer</button>

            <p id="practice-feedback"></p>
        `;

        document
            .getElementById("submit-practice")
            .addEventListener("click", () => {
                submitPracticeAnswer(question);
            });
    }


    async function submitPracticeAnswer(question) {
        const selected = document.querySelector(
            'input[name="practice_answer"]:checked'
        );

        if (!selected) {
            document.getElementById("practice-feedback").textContent =
                "Please select an answer.";
            return;
        }

        const isCorrect = selected.value === question.correct_answer;

        const response = await fetch(
            `/agent/advance?is_correct=${isCorrect}`,
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(agentState)
            }
        );

        const data = await response.json();

        agentState = data.state;

        if (isCorrect) {
            document.getElementById("practice-feedback").textContent =
                "Correct!";
        } else {
            document.getElementById("practice-feedback").textContent =
                `Incorrect. Correct answer: ${question.correct_answer}`;
        }

        setTimeout(() => {
            if (agentState.status === "complete") {
                reportBox.innerHTML = `
                    <h2>Study Complete</h2>
                    <p>You completed all detected weak topics.</p>
                `;
                practiceBox.innerHTML = "";
                return;
            }

            reportBox.innerHTML = `
                <h2>Progress</h2>
                <p><strong>Remaining weak topics:</strong>
                    ${agentState.weak_topics.join(", ")}
                </p>
                <p><strong>Current focus:</strong>
                    ${agentState.current_topic}
                </p>
            `;

            showPracticeQuestion(data.practice_question);
        }, 1800);
    }
</script>
</body>
</html>
