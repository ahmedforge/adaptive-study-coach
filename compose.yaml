services:
  coach:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - progress:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).close()"]
      interval: 5s
      timeout: 4s
      retries: 12
volumes:
  progress:
