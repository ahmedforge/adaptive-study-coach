name: Project checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  question-bank:
    name: Question bank validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install bank validator dependency
        run: python -m pip install 'pydantic>=2,<3'
      - name: Validate bank and show coverage
        run: |
          python -m tools.question_bank validate
          python -m tools.question_bank coverage

  tests:
    name: Python tests and JavaScript syntax
    needs: question-bank
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GEMINI_API_KEY: ''
      PYTHONDONTWRITEBYTECODE: '1'
      HF_HOME: ${{ runner.temp }}/hf-cache
      MLFLOW_TRACKING_URI: sqlite:///${{ runner.temp }}/test-mlflow.db
      STUDY_COACH_DB: ${{ runner.temp }}/test-progress.sqlite3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Cache public embedding model
        uses: actions/cache@v6
        with:
          path: ${{ env.HF_HOME }}
          key: minilm-${{ runner.os }}-py312-${{ hashFiles('requirements.txt', 'requirements-test.txt', 'app/services/embedding_service.py') }}
      - name: Install CPU runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-test.txt
          python -m pip check
      - name: Check browser script syntax
        run: |
          node --check app/static/app.js
          node --check app/static/exam.js
          node --check app/static/session-library.js
          node --check app/static/dashboard.js
          node --check app/static/account.js
      - name: Test browser session library
        run: node --test tests/session-library.test.cjs
      - name: Run complete test suite
        run: python -m pytest -q --junitxml=reports/pytest.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-report
          path: reports/pytest.xml
          if-no-files-found: warn
          retention-days: 7
