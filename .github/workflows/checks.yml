name: Project checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  question-bank:
    name: Question bank validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install bank validator dependency
        run: python -m pip install 'pydantic>=2,<3'
      - name: Validate bank and show coverage
        run: |
          python -m tools.question_bank validate
          python -m tools.question_bank coverage

  tests:
    name: Python tests and JavaScript syntax
    needs: question-bank
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GEMINI_API_KEY: ''
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            requirements-test.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install runtime and test dependencies
        run: |
          python -m pip install -r requirements-test.txt
          python -m pip check
      - name: Check browser script syntax
        run: |
          node --check app/static/app.js
          node --check app/static/exam.js
          node --check app/static/session-library.js
          node --check app/static/dashboard.js
          node --check app/static/account.js
      - name: Test browser session library
        run: node --test tests/session-library.test.cjs
      - name: Run complete test suite
        env:
          STUDY_COACH_DB: ${{ runner.temp }}/test-progress.sqlite3
        run: python -m pytest -q --junitxml=reports/pytest.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-report
          path: reports/pytest.xml
          if-no-files-found: warn
          retention-days: 7

  container:
    name: Container startup and persistence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: docker compose up --build --wait
      - name: Verify a saved exam survives container replacement
        run: |
          token=$(curl -fsS -H 'Content-Type: application/json' -d '{"question_count":12,"duration_minutes":15}' http://127.0.0.1:8000/exams | jq -er .exam_token)
          docker compose up --force-recreate --wait
          curl -fsS -H "Authorization: Bearer $token" http://127.0.0.1:8000/exams/current | jq -e '.questions | length == 12'
      - if: always()
        run: docker compose down --volumes

  semantic-integration:
    name: Real MiniLM model integration
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install the optional stack
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt -r requirements-test.txt
      - name: Run semantic ranking against the actual model
        run: python -m pytest -q tests/test_retrieval_service.py::test_retrieval_returns_relevant_question
